name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  WORKER_NAME: my-worker

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Deploy Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler preview --json --name "$PREVIEW_NAME" --tag "${{ github.sha }}" --message "PR #${{ github.event.pull_request.number }} preview")
          printf '%s\n' "$OUTPUT"

          PREVIEW_JSON=$(printf '%s' "$OUTPUT" | node -e 'const fs = require("node:fs"); const text = fs.readFileSync(0, "utf8"); const start = text.indexOf("{"); if (start < 0) process.exit(1); process.stdout.write(text.slice(start));')
          PREVIEW_URL=$(printf '%s' "$PREVIEW_JSON" | jq -r '.preview.urls[0] // empty')
          DEPLOYMENT_ID=$(printf '%s' "$PREVIEW_JSON" | jq -r '.deployment.id // empty')
          DEPLOYMENT_URL=$(printf '%s' "$PREVIEW_JSON" | jq -r '.deployment.urls[0] // empty')

          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Could not find a preview URL in wrangler output"
            exit 1
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL="$PREVIEW_URL"
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Capture screenshot with Browser Run
        id: screenshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEBUG_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p preview-output
          REQUEST=$(jq -nc \
            --arg url "${PREVIEW_URL}?debugId=${DEBUG_ID}" \
            --arg accessClientId "$CF_ACCESS_CLIENT_ID" \
            --arg accessClientSecret "$CF_ACCESS_CLIENT_SECRET" \
            '{
            url: $url,
            setExtraHTTPHeaders: {
              "CF-Access-Client-Id": $accessClientId,
              "CF-Access-Client-Secret": $accessClientSecret
            },
            viewport: { width: 1440, height: 1120 },
            selector: "main"
          }')

          STATUS=$(curl -sS \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/browser-rendering/screenshot" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST" \
            --output preview-output/screenshot.png \
            --write-out "%{http_code}")

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Browser Run screenshot request failed with HTTP ${STATUS}"
            cat preview-output/screenshot.png
            exit 1
          fi

          test -s preview-output/screenshot.png

          echo "debug_id=$DEBUG_ID" >> "$GITHUB_OUTPUT"

      - name: Probe Preview runtime for WOBS correlation
        id: wobs-probe
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEBUG_ID: ${{ steps.screenshot.outputs.debug_id }}
        run: |
          set -euo pipefail
          mkdir -p preview-output

          probe() {
            local name="$1"
            local path="$2"
            local file="preview-output/${name}.json"
            local status
            status=$(curl -sS \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              -H "x-debug-id: ${DEBUG_ID}" \
              "${PREVIEW_URL}${path}?debugId=${DEBUG_ID}" \
              --output "$file" \
              --write-out "%{http_code}" || true)
            local request_id
            request_id=$(jq -r '.requestId // "unknown"' "$file" 2>/dev/null || printf 'unknown')
            echo "${name}_status=$status" >> "$GITHUB_OUTPUT"
            echo "${name}_request_id=$request_id" >> "$GITHUB_OUTPUT"
          }

          probe health /api/health
          probe astro /api/astro/feed
          probe do_read /api/staging/rsvp
          probe do_write /api/staging/rsvp/reserve
          probe cache /api/cache/warm
          probe trace /api/observability/trace
          probe burst /api/observability/burst
          probe session /api/session/refresh

      - name: Publish screenshot for PR comment
        id: publish-screenshot
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORKTREE=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$ARTIFACT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ARTIFACT_BRANCH"
            git worktree add "$WORKTREE" "origin/$ARTIFACT_BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" switch --orphan "$ARTIFACT_BRANCH"
            git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WORKTREE/screenshots"
          SCREENSHOT_FILE="${GITHUB_SHA}.png"
          cp preview-output/screenshot.png "$WORKTREE/screenshots/${SCREENSHOT_FILE}"
          cp preview-output/screenshot.png "$WORKTREE/screenshots/latest.png"
          git -C "$WORKTREE" add "screenshots/${SCREENSHOT_FILE}" screenshots/latest.png
          git -C "$WORKTREE" commit -m "Update screenshot for PR ${PR_NUMBER}" || true
          git -C "$WORKTREE" push origin "HEAD:$ARTIFACT_BRANCH"

          SCREENSHOT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ARTIFACT_BRANCH}/screenshots/${SCREENSHOT_FILE}"
          echo "screenshot_url=$SCREENSHOT_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SCREENSHOT_URL: ${{ steps.publish-screenshot.outputs.screenshot_url }}
          DEBUG_ID: ${{ steps.screenshot.outputs.debug_id }}
          HEALTH_STATUS: ${{ steps.wobs-probe.outputs.health_status }}
          ASTRO_STATUS: ${{ steps.wobs-probe.outputs.astro_status }}
          SESSION_STATUS: ${{ steps.wobs-probe.outputs.session_status }}
          DO_READ_STATUS: ${{ steps.wobs-probe.outputs.do_read_status }}
          DO_WRITE_STATUS: ${{ steps.wobs-probe.outputs.do_write_status }}
          CACHE_STATUS: ${{ steps.wobs-probe.outputs.cache_status }}
          TRACE_STATUS: ${{ steps.wobs-probe.outputs.trace_status }}
          BURST_STATUS: ${{ steps.wobs-probe.outputs.burst_status }}
          HEALTH_REQUEST_ID: ${{ steps.wobs-probe.outputs.health_request_id }}
          ASTRO_REQUEST_ID: ${{ steps.wobs-probe.outputs.astro_request_id }}
          SESSION_REQUEST_ID: ${{ steps.wobs-probe.outputs.session_request_id }}
          DO_READ_REQUEST_ID: ${{ steps.wobs-probe.outputs.do_read_request_id }}
          DO_WRITE_REQUEST_ID: ${{ steps.wobs-probe.outputs.do_write_request_id }}
          CACHE_REQUEST_ID: ${{ steps.wobs-probe.outputs.cache_request_id }}
          TRACE_REQUEST_ID: ${{ steps.wobs-probe.outputs.trace_request_id }}
          BURST_REQUEST_ID: ${{ steps.wobs-probe.outputs.burst_request_id }}
        with:
          script: |
            const marker = '<!-- worker-preview:my-worker -->';
            const previewUrl = process.env.PREVIEW_URL;
            const deploymentUrl = process.env.DEPLOYMENT_URL || previewUrl;
            const screenshotUrl = process.env.SCREENSHOT_URL;
            const deploymentId = process.env.DEPLOYMENT_ID || 'unknown';
            const previewName = `pr-${context.issue.number}`;
            const wobsPath = `/workers/services/view/${process.env.WORKER_NAME}/production/previews/${previewName}/observability/events`;
            const probes = [
              ['Health', process.env.HEALTH_STATUS, process.env.HEALTH_REQUEST_ID],
              ['Astro feed', process.env.ASTRO_STATUS, process.env.ASTRO_REQUEST_ID],
              ['Session refresh', process.env.SESSION_STATUS, process.env.SESSION_REQUEST_ID],
              ['DO read', process.env.DO_READ_STATUS, process.env.DO_READ_REQUEST_ID],
              ['DO write', process.env.DO_WRITE_STATUS, process.env.DO_WRITE_REQUEST_ID],
              ['Cache warm', process.env.CACHE_STATUS, process.env.CACHE_REQUEST_ID],
              ['Trace', process.env.TRACE_STATUS, process.env.TRACE_REQUEST_ID],
              ['Burst', process.env.BURST_STATUS, process.env.BURST_REQUEST_ID],
            ];
            const failedProbes = probes.filter(([, status]) => {
              const code = Number(status || 0);
              return code < 200 || code >= 400;
            });
            const runtimeStatus = failedProbes.length > 0 ? 'Runtime probe issue detected' : 'Runtime probes clean';
            const probeRows = probes.map(([name, status, requestId]) => `| ${name} | \`${status || 'unknown'}\` / \`${requestId || 'unknown'}\` |`).join('\n');
            const runtimeDetails = failedProbes.length > 0
              ? `### Detected issue

            The Preview rendered, but one or more runtime probes failed during the same validation flow.

            | Probe | Evidence |
            | --- | --- |
            ${failedProbes.map(([name, status, requestId]) => `| ${name} | \`${status || 'unknown'}\` / \`${requestId || 'unknown'}\` |`).join('\n')}

            Search WOBS for \`${process.env.DEBUG_ID}\` to see the matching Worker logs and traces.`
              : `### Fix verification

            The preview rendered and every runtime probe returned a healthy status.

            | Check | Evidence |
            | --- | --- |
            ${probeRows}
            | Debug correlation | search WOBS for \`${process.env.DEBUG_ID}\` |`;

            const body = `${marker}
            ## Preview

            [Open the latest Preview](${previewUrl})

            ![Browser Run screenshot of the Preview](${screenshotUrl})

            | Field | Value |
            | --- | --- |
            | Preview | \`pr-${context.issue.number}\` |
            | Preview URL | ${previewUrl} |
            | Deployment | [\`${deploymentId}\`](${deploymentUrl}) |
            | Worker | \`${process.env.WORKER_NAME}\` |
            | Debug ID | \`${process.env.DEBUG_ID}\` |
            | Health probe | \`${process.env.HEALTH_STATUS}\` / \`${process.env.HEALTH_REQUEST_ID}\` |
            | Astro feed probe | \`${process.env.ASTRO_STATUS}\` / \`${process.env.ASTRO_REQUEST_ID}\` |
            | Session refresh probe | \`${process.env.SESSION_STATUS}\` / \`${process.env.SESSION_REQUEST_ID}\` |
            | DO read probe | \`${process.env.DO_READ_STATUS}\` / \`${process.env.DO_READ_REQUEST_ID}\` |
            | DO write probe | \`${process.env.DO_WRITE_STATUS}\` / \`${process.env.DO_WRITE_REQUEST_ID}\` |
            | Cache warm probe | \`${process.env.CACHE_STATUS}\` / \`${process.env.CACHE_REQUEST_ID}\` |
            | Trace probe | \`${process.env.TRACE_STATUS}\` / \`${process.env.TRACE_REQUEST_ID}\` |
            | Burst probe | \`${process.env.BURST_STATUS}\` / \`${process.env.BURST_REQUEST_ID}\` |
            | WOBS path | \`${wobsPath}\` |

            ### Runtime signal

            ${runtimeStatus}. Browser Run captured the page, then the workflow sent health, Astro, Durable Object, cache, trace, burst, and session-refresh requests with the same debug ID.

            ${runtimeDetails}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund

      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation || true

      - name: Delete screenshot branch
        env:
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: git push origin --delete "$ARTIFACT_BRANCH" || true

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- worker-preview:my-worker -->';
            const status = context.payload.pull_request.merged ? 'Merged' : 'Closed';
            const body = `${marker}
            ## Preview

            ${status}. The Preview and screenshot artifact branch were deleted.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --tag "${{ github.sha }}" --message "${{ github.event.head_commit.message }}"
